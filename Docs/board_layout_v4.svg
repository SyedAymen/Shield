<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 950" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1150" height="950" fill="#fafaf8"/>

  <text x="575" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">UNO Q Custom Shield — Top-Down Layout (rev 4)</text>
  <text x="575" y="56" text-anchor="middle" font-size="13" fill="#666">Each zone is self-contained: its own support ICs and voltage regulator, no shared chips between zones</text>

  <!-- Board outline -->
  <rect x="100" y="90" width="950" height="700" rx="10" fill="#ffffff" stroke="#222" stroke-width="2.5"/>

  <!-- Top mating connectors -->
  <rect x="120" y="100" width="130" height="26" fill="#e8e8e8" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="185" y="118" text-anchor="middle" font-size="11" font-weight="600">JMEDIA (male)</text>

  <rect x="270" y="100" width="130" height="26" fill="#e8e8e8" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="335" y="118" text-anchor="middle" font-size="11" font-weight="600">JMISC (male)</text>

  <text x="260" y="98" text-anchor="middle" font-size="9" fill="#888">45.54 mm →</text>

  <rect x="420" y="100" width="140" height="26" fill="#fff" stroke="#888" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="490" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#555">JDIGITAL — passthrough</text>

  <rect x="580" y="100" width="140" height="26" fill="#fff" stroke="#888" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="650" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#555">JANALOG — passthrough</text>

  <text x="565" y="93" text-anchor="middle" font-size="8" fill="#999">isolated from each other — no harness, no shared nets</text>

  <rect x="860" y="100" width="140" height="26" fill="#e8e8e8" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="930" y="118" text-anchor="middle" font-size="11" font-weight="600">JSPI tab (harness)</text>

  <!-- ===================== ZONE 1: Camera + DSI (left) ===================== -->
  <rect x="115" y="148" width="230" height="620" rx="6" fill="#eaf3fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="230" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4971">CAMERA + DISPLAY</text>

  <rect x="122" y="195" width="22" height="190" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="133" y="295" text-anchor="middle" font-size="9" fill="#2b6cb0" transform="rotate(-90 133,295)">22-pin FPC edge connector</text>

  <rect x="160" y="195" width="170" height="90" fill="#fff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="245" y="218" text-anchor="middle" font-size="11" font-weight="600">RPi Camera FPC</text>
  <text x="245" y="234" text-anchor="middle" font-size="10" fill="#555">CSI0 + CCI_I2C0</text>
  <text x="245" y="249" text-anchor="middle" font-size="10" fill="#555">22-pin, vertical, left edge</text>
  <text x="245" y="264" text-anchor="middle" font-size="9" fill="#777">(unchanged)</text>

  <rect x="122" y="420" width="22" height="190" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="133" y="520" text-anchor="middle" font-size="9" fill="#2b6cb0" transform="rotate(-90 133,520)">22-pin FPC edge connector</text>

  <rect x="160" y="420" width="170" height="90" fill="#fff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="245" y="443" text-anchor="middle" font-size="11" font-weight="600">DSI Display FPC</text>
  <text x="245" y="459" text-anchor="middle" font-size="10" fill="#555">MIPI_DSI0</text>
  <text x="245" y="474" text-anchor="middle" font-size="10" fill="#555">22-pin, vertical, left edge</text>
  <text x="245" y="489" text-anchor="middle" font-size="9" fill="#777">(unchanged)</text>

  <rect x="160" y="320" width="170" height="50" fill="#fff" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="245" y="340" text-anchor="middle" font-size="10" font-weight="600">CCI1 (free bus)</text>
  <text x="245" y="355" text-anchor="middle" font-size="9" fill="#555">→ DSI touch/IO (TBD verify)</text>

  <rect x="160" y="530" width="170" height="45" fill="#fff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="245" y="550" text-anchor="middle" font-size="10" font-weight="600">TCA9406DCUR</text>
  <text x="245" y="564" text-anchor="middle" font-size="9" fill="#555">CCI level translator</text>

  <!-- ===================== ZONE 2: Control I/O (center, below JMISC) ===================== -->
  <rect x="360" y="148" width="200" height="620" rx="6" fill="#f3f0fa" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="460" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#44267a">CONTROL I/O</text>

  <rect x="380" y="195" width="160" height="60" fill="#fff" stroke="#6b46c1" stroke-width="1.2"/>
  <text x="460" y="218" text-anchor="middle" font-size="10" font-weight="600">JMISC passthrough</text>
  <text x="460" y="233" text-anchor="middle" font-size="9" fill="#555">SE0 I2C (37/39)</text>
  <text x="460" y="246" text-anchor="middle" font-size="9" fill="#555">free GPIO 41/43/45/47</text>

  <rect x="380" y="270" width="160" height="55" fill="#fff" stroke="#6b46c1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="460" y="292" text-anchor="middle" font-size="10" font-weight="600">Continuity check</text>
  <text x="460" y="307" text-anchor="middle" font-size="9" fill="#555">37↔41 / 39↔43 (TBD)</text>

  <rect x="380" y="340" width="160" height="55" fill="#fff" stroke="#c53030" stroke-width="1.2"/>
  <text x="460" y="362" text-anchor="middle" font-size="10" font-weight="600" fill="#c53030">D0/D1 = OFF LIMITS</text>
  <text x="460" y="377" text-anchor="middle" font-size="9" fill="#555">arduino-router lock</text>

  <rect x="380" y="410" width="160" height="65" fill="#fff" stroke="#6b46c1" stroke-width="1.2"/>
  <text x="460" y="432" text-anchor="middle" font-size="10" font-weight="600">All control via I2C</text>
  <text x="460" y="447" text-anchor="middle" font-size="9" fill="#555">per-zone TCA9555 expanders</text>
  <text x="460" y="461" text-anchor="middle" font-size="9" fill="#555">no JDIGITAL/JANALOG nets used</text>

  <rect x="380" y="490" width="160" height="60" fill="#fff" stroke="#6b46c1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="460" y="510" text-anchor="middle" font-size="9" font-weight="600">PSSI pins (JMISC MCU side)</text>
  <text x="460" y="524" text-anchor="middle" font-size="9" fill="#c53030">locked — not usable as GPIO</text>
  <text x="460" y="537" text-anchor="middle" font-size="8" fill="#777">confirmed, do not route here</text>

  <!-- ===================== Right side: LoRa zone (top) ===================== -->
  <rect x="580" y="148" width="370" height="190" rx="6" fill="#fdf3e7" stroke="#c05621" stroke-width="1.5"/>
  <text x="765" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3a0e">LoRa ZONE — Elecrow LR1302</text>

  <rect x="595" y="185" width="160" height="55" fill="#fff" stroke="#c05621" stroke-width="1.2"/>
  <text x="675" y="204" text-anchor="middle" font-size="10" font-weight="600">LR1302 module (mPCIe)</text>
  <text x="675" y="218" text-anchor="middle" font-size="9" fill="#555">SPI: pins 45/47/49/51</text>
  <text x="675" y="231" text-anchor="middle" font-size="9" fill="#555">→ JSPI MISO/SCK/MOSI</text>

  <rect x="765" y="185" width="170" height="55" fill="#fff" stroke="#c05621" stroke-width="1.2"/>
  <text x="850" y="204" text-anchor="middle" font-size="10" font-weight="600">TCA9555RGER (dedicated)</text>
  <text x="850" y="218" text-anchor="middle" font-size="9" fill="#555">RESET (pin22) / no 2nd CS needed</text>
  <text x="850" y="231" text-anchor="middle" font-size="9" fill="#555">1PPS/I2C temp-sensor unused</text>

  <rect x="595" y="248" width="160" height="48" fill="#fff" stroke="#c05621" stroke-width="1.2"/>
  <text x="675" y="266" text-anchor="middle" font-size="10" font-weight="600">AMS1117-3.3 LDO</text>
  <text x="675" y="279" text-anchor="middle" font-size="9" fill="#555">VIN=JSPI +5V, VOUT=3.3V</text>
  <text x="675" y="290" text-anchor="middle" font-size="8" fill="#777">+2× 10µF caps (in/out)</text>

  <rect x="765" y="248" width="170" height="48" fill="#fff" stroke="#c05621" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="850" y="266" text-anchor="middle" font-size="10" font-weight="600">Antenna keepout — TBD</text>
  <text x="850" y="279" text-anchor="middle" font-size="9" fill="#555">U.FL/IPEX-1, dual radio ant.</text>

  <path d="M 675,185 L 675,150 L 930,150 L 930,126" stroke="#c05621" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <text x="800" y="142" font-size="9" fill="#c05621">only harness in design: LoRa → JSPI</text>

  <!-- ===================== LTE zone (middle) ===================== -->
  <rect x="580" y="348" width="370" height="190" rx="6" fill="#e9f7ef" stroke="#1f7a3d" stroke-width="1.5"/>
  <text x="765" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#155226">LTE ZONE — SIMCom A7672S</text>

  <rect x="595" y="385" width="160" height="50" fill="#fff" stroke="#1f7a3d" stroke-width="1.2"/>
  <text x="675" y="404" text-anchor="middle" font-size="10" font-weight="600">A7672S module</text>
  <text x="675" y="417" text-anchor="middle" font-size="9" fill="#555">USB ECM + AT</text>
  <text x="675" y="428" text-anchor="middle" font-size="8" fill="#777">(to hub, internal trace)</text>

  <rect x="765" y="385" width="170" height="50" fill="#fff" stroke="#1f7a3d" stroke-width="1.2"/>
  <text x="850" y="404" text-anchor="middle" font-size="10" font-weight="600">TCA9555RGER (dedicated)</text>
  <text x="850" y="417" text-anchor="middle" font-size="9" fill="#555">PWRKEY / RESET</text>
  <text x="850" y="428" text-anchor="middle" font-size="9" fill="#555">STATUS / NETLIGHT</text>

  <rect x="595" y="443" width="160" height="42" fill="#fff" stroke="#c53030" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="675" y="461" text-anchor="middle" font-size="10" font-weight="600" fill="#c53030">VBAT regulator — GAP</text>
  <text x="675" y="474" text-anchor="middle" font-size="9" fill="#555">3.4–4.2V, multi-amp IC TBD</text>

  <rect x="765" y="443" width="170" height="42" fill="#fff" stroke="#c53030" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="850" y="461" text-anchor="middle" font-size="10" font-weight="600" fill="#c53030">SIM holder — GAP</text>
  <text x="850" y="474" text-anchor="middle" font-size="9" fill="#555">VSIM/CLK/DATA/RST</text>

  <rect x="595" y="493" width="340" height="35" fill="#fff" stroke="#c53030" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="765" y="514" text-anchor="middle" font-size="10" font-weight="600" fill="#c53030">Antenna keepout — TBD (pending A7672S spec)</text>

  <!-- ===================== USB Hub zone (bottom) ===================== -->
  <rect x="580" y="548" width="370" height="242" rx="6" fill="#fdeef0" stroke="#a3275c" stroke-width="1.5"/>
  <text x="765" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#6b1638">USB HUB ZONE — Microchip USB5744</text>

  <rect x="595" y="583" width="160" height="42" fill="#fff" stroke="#a3275c" stroke-width="1.2"/>
  <text x="675" y="601" text-anchor="middle" font-size="10" font-weight="600">USB5744 hub IC</text>
  <text x="675" y="614" text-anchor="middle" font-size="8" fill="#555">4-port SS/HS, BC1.2</text>

  <rect x="765" y="583" width="170" height="42" fill="#fff" stroke="#a3275c" stroke-width="1.2"/>
  <text x="850" y="601" text-anchor="middle" font-size="10" font-weight="600">24 MHz crystal</text>
  <text x="850" y="614" text-anchor="middle" font-size="8" fill="#555">+ 2× load caps (ICLK/OCLK)</text>

  <rect x="595" y="633" width="105" height="40" fill="#fff" stroke="#a3275c" stroke-width="1.2"/>
  <text x="647" y="650" text-anchor="middle" font-size="9" font-weight="600">1.2V regulator</text>
  <text x="647" y="662" text-anchor="middle" font-size="8" fill="#555">dedicated VDD12</text>

  <rect x="708" y="633" width="100" height="40" fill="#fff" stroke="#a3275c" stroke-width="1.2"/>
  <text x="758" y="650" text-anchor="middle" font-size="9" font-weight="600">RBIAS</text>
  <text x="758" y="662" text-anchor="middle" font-size="8" fill="#555">12kΩ 1% → GND</text>

  <rect x="816" y="633" width="119" height="40" fill="#fff" stroke="#a3275c" stroke-width="1.2"/>
  <text x="875" y="650" text-anchor="middle" font-size="9" font-weight="600">SPI config ROM</text>
  <text x="875" y="662" text-anchor="middle" font-size="8" fill="#555">VID/PID/port config</text>

  <rect x="595" y="681" width="160" height="34" fill="#fff" stroke="#a3275c" stroke-width="1.2"/>
  <text x="675" y="702" text-anchor="middle" font-size="9" font-weight="600">Reset supervisor</text>

  <rect x="765" y="681" width="170" height="34" fill="#fff" stroke="#c53030" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="850" y="698" text-anchor="middle" font-size="9" font-weight="600" fill="#c53030">Type-C mux + CC ctrl — GAP</text>
  <text x="850" y="710" text-anchor="middle" font-size="8" fill="#555">for the Type-C downstream port</text>

  <rect x="595" y="723" width="340" height="22" fill="#fff" stroke="#a3275c" stroke-width="1.2"/>
  <text x="765" y="738" text-anchor="middle" font-size="9" font-weight="600">SS-rated ESD array ×3 ports (not USBLC6-2SC6)</text>

  <!-- 3 ports, edge-mounted, facing outward at bottom board edge -->
  <rect x="595" y="753" width="105" height="34" fill="#fff" stroke="#a3275c" stroke-width="1.6"/>
  <text x="647" y="773" text-anchor="middle" font-size="9" font-weight="600">USB-A 1</text>

  <rect x="710" y="753" width="105" height="34" fill="#fff" stroke="#a3275c" stroke-width="1.6"/>
  <text x="762" y="773" text-anchor="middle" font-size="9" font-weight="600">USB-A 2</text>

  <rect x="825" y="753" width="105" height="34" fill="#fff" stroke="#a3275c" stroke-width="1.6"/>
  <text x="877" y="773" text-anchor="middle" font-size="9" font-weight="600">USB-C</text>

  <text x="765" y="800" text-anchor="middle" font-size="9" fill="#a3275c">↓ ports face outward through the bottom board edge ↓</text>

  <!-- internal trace hub -> LTE -->
  <path d="M 595,604 L 595,400 L 595,400" stroke="#a3275c" stroke-width="1.3" stroke-dasharray="5,3" fill="none"/>
  <path d="M 700,604 C 500,500 500,420 595,410" stroke="#a3275c" stroke-width="1.3" stroke-dasharray="5,3" fill="none"/>
  <text x="500" y="500" font-size="8" fill="#a3275c">internal trace: hub → LTE USB_DP/DN/VBUS</text>

  <!-- Legend -->
  <text x="115" y="817" font-size="10" fill="#333">Legend: solid border = placed/confirmed · dashed red = unresolved gap · dashed grey = passthrough/keepout, no electrical connection</text>
  <text x="115" y="834" font-size="10" fill="#333">Each right-side zone (LoRa / LTE / USB Hub) now carries its own dedicated TCA9555/regulator — no shared chips between zones.</text>
  <text x="115" y="851" font-size="10" fill="#333">Conceptual floorplan only — not yet dimensioned for trace length, impedance, or antenna keepout.</text>

</svg>
