<text x="20" y="1142" fill="#888" font-size="9" font-family="Courier New">J1=JMEDIA(FTSH-130) J2=JMISC(FTSH-130) J3=FPC-15 J4=HDR-2x20 J5=HDR-2x20 U1=PCA9306</text>

<!-- KICAD NOTES BOX (right side)                                   -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<rect x="1000" y="540" width="500" height="490" fill="none" stroke="#333" stroke-width="1"/>
<text x="1010" y="558" fill="#00CCFF" font-size="10" font-weight="bold">KiCad Setup Notes</text>

<text x="1010" y="575" fill="#FFFF00" font-size="9">Power symbols (schematic editor, press P):</text>
<text x="1010" y="589" fill="#888" font-size="8">+3V3 → search "+3.3V" or create custom power symbol</text>
<text x="1010" y="601" fill="#888" font-size="8">+1V8 → search "+1.8V"  |  VIN → use "VIN" power symbol</text>
<text x="1010" y="613" fill="#888" font-size="8">GND  → standard "GND" (inverted triangle)</text>
<text x="1010" y="625" fill="#888" font-size="8">PWR_FLAG → place on every net sourced from connector pin</text>

<text x="1010" y="642" fill="#FFFF00" font-size="9">How to label power input pins in KiCad:</text>
<text x="1010" y="656" fill="#888" font-size="8">1. Open symbol editor → J1 component → select pin 57 (VIN)</text>
<text x="1010" y="668" fill="#888" font-size="8">2. Right-click pin → Properties → set Type to "Power Input"</text>
<text x="1010" y="680" fill="#888" font-size="8">3. Set pin 58 (+3V3) type to "Power Output" (it's a source)</text>
<text x="1010" y="692" fill="#888" font-size="8">4. J2 pin 57 (+1V8) → "Power Output"</text>
<text x="1010" y="704" fill="#888" font-size="8">5. Add PWR_FLAG to +3V3, +1V8, GND nets to clear ERC</text>

<text x="1010" y="721" fill="#FFFF00" font-size="9">4-Layer board (Board Setup → Board Stackup):</text>
<text x="1010" y="735" fill="#888" font-size="8">L1 F.Cu   — Signal: MIPI pairs, I2C, GPIO (all traces here)</text>
<text x="1010" y="747" fill="#888" font-size="8">L2 In1.Cu — GND plane: solid copper, no cuts under MIPI</text>
<text x="1010" y="759" fill="#888" font-size="8">L3 In2.Cu — Power: +3V3 zone (J1 side) + +1V8 zone (J2 side)</text>
<text x="1010" y="771" fill="#888" font-size="8">L4 B.Cu   — Signal overflow / mechanical</text>

<text x="1010" y="788" fill="#FFFF00" font-size="9">Power plane on L3 (In2.Cu) steps:</text>
<text x="1010" y="802" fill="#888" font-size="8">1. Select In2.Cu in layer dropdown</text>
<text x="1010" y="814" fill="#888" font-size="8">2. Place → Add Rule Area (Ctrl+Shift+Z)</text>
<text x="1010" y="826" fill="#888" font-size="8">3. Draw zone around J1 side → Net: +3V3, Fill: Solid</text>
<text x="1010" y="838" fill="#888" font-size="8">4. Second zone around J2/U1 side → Net: +1V8, Fill: Solid</text>
<text x="1010" y="850" fill="#888" font-size="8">5. Press B to fill. Set 0.5mm clearance between the two zones</text>
<text x="1010" y="862" fill="#888" font-size="8">6. Vias to L3: only for power. Size: 0.4mm drill / 0.8mm ring</text>

<text x="1010" y="879" fill="#FFFF00" font-size="9">Net classes (Design Rules → Net Classes):</text>
<text x="1010" y="893" fill="#888" font-size="8">MIPI: W=0.15mm gap=0.15mm clearance=0.15mm — 100Ω diff</text>
<text x="1010" y="905" fill="#888" font-size="8">POWER: W=0.3mm clearance=0.2mm</text>
<text x="1010" y="917" fill="#888" font-size="8">Default: W=0.2mm clearance=0.2mm (I2C, GPIO)</text>
